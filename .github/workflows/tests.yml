name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy==2.3.5 pandas==2.3.3 pyarrow==23.0.1 scikit-learn==1.7.2 xgboost==3.2.0 ta==0.11.0 pytest
      - name: Run leakage and correctness tests
        run: pytest -q
